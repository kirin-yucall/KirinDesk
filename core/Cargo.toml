[package]
name = "kirin-desk-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bincode.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64 = "0.22"
# S-18 (F-23): 常量时间比较（固定挑战码比对，防时序侧信道）
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
tracing.workspace = true
get-if-addrs = { version = "0.5", package = "get_if_addrs" }
# M8-T033: 双栈监听需在 bind 前设置 IPV6_V6ONLY（tokio TcpSocket 无 set_only_v6，
# 与 media transport 的 QUIC 双栈 bind 同用 socket2）
socket2 = "0.6"
dirs-next = "2.0"
libloading = "0.8"   # M12-MAC MAC-T006：macOS Keychain 经 dlopen Security/CoreFoundation
kirin-desk-dns = { path = "../dns" }
# M8-T040 (W2-C / WBS 5.7): 单测 mock 解析器实现 Resolver trait（dns 侧同版本）
async-trait = "0.1"
# M8-T026-P1: 客户端审计（打洞成功/失败/重打洞/换路事件，PUNCH-SEC-004）
kirin-desk-utils = { path = "../utils" }
# M8-T026-P1: 打洞协议类型（候选交换/探测报文，relay 为叶子 crate，无循环）
kirin-desk-relay = { path = "../relay" }

# M11: 远程 Shell PTY 模式 — 跨平台 PTY（Windows=ConPTY / Unix=forkpty+openpty）
portable-pty = "0.9"
