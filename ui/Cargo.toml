edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
kirin-desk-core = { path = "../core" }
kirin-desk-dns = { path = "../dns" }
kirin-desk-input = { path = "../input" }
kirin-desk-media = { path = "../media" }
kirin-desk-updater = { path = "../updater" }
kirin-desk-utils = { path = "../utils" }
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "net"] }
