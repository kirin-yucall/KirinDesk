[package]
name = "kirin-desk-ui"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# M8-T040 (WBS 8.2): self-test mock PubIpSource / Resolver 实现（dns 侧同版本）
async-trait = "0.1"
kirin-desk-core = { path = "../core" }
kirin-desk-dns = { path = "../dns" }
kirin-desk-input = { path = "../input" }
kirin-desk-media = { path = "../media" }
kirin-desk-relay = { path = "../relay" }
kirin-desk-updater = { path = "../updater" }
kirin-desk-utils = { path = "../utils" }
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "net"] }
bincode.workspace = true
tracing.workspace = true
chrono.workspace = true
dirs-next = "2.0"
egui = "0.28"
eframe = "0.28"

# M11: 远程 Shell PTY 模式 — ANSI 解析/终端模拟器 + CLI raw mode
vt100 = "0.16"
crossterm = "0.29"

# M13-T003: 剪贴板共享（客户端 ⇄ 服务端）
arboard = "3.4"
# S-13 (F-16): connect 挑战码 stdin 交互输入（不回显；挑战码不再落命令行）
rpassword.workspace = true

[lints.rust]
# R-33: media/build.rs 在 libkirin_gpu 链接条件下 emit 的 cfg——ui 侧引用同一
# 门控（#[cfg(kirin_gpu_linked)] 回退 None），声明为已知以消除 unexpected_cfgs
# 告警（与 media/Cargo.toml 同配置）。
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kirin_gpu_linked)"] }
