[device]
id = "default-device"
name = "My Device"
nickname = ""
challenge_code = ""

[godaddy]
api_key = ""
api_secret = ""
domain = "example.com"
api_url = "https://api.godaddy.com"

[network]
port = 3389
heartbeat_interval = 30
dns_ttl = 600

[media]
encoder = "auto"
framerate = 30
bitrate = 5000

[logging]
level = "info"
format = "text"

[unattended]
# 无人值守模式：开机自启 + 自动开启服务端 + 受信任设备自动接受连接（PTY/远控）
enabled = false
auto_start_on_boot = false
auto_start_server = true
